[project]
name = "vantage"
version = "0.1.0"
description = "Visual Anonymization & Tactical Graphics Editor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Studio RainShelter"}
]
keywords = ["image", "anonymization", "mosaic", "privacy", "face-detection"]

dependencies = [
    "PySide6>=6.6.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
vantage = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pyinstaller]
# PyInstaller build configuration
name = "VANTAGE"
onefile = true
windowed = true
icon = "resources/icons/app.ico"
